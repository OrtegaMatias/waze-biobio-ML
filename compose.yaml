name: waze-biobio-ml

services:
  backend:
    build:
      context: .
      target: backend
    environment:
      PYTHONPATH: /app
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped
    volumes:
      - ./data/raw:/app/data/raw:ro
      - ./data/processed:/app/data/processed:ro
      - backend_cache:/app/data/cache

  frontend:
    build:
      context: .
      target: frontend
    depends_on:
      - backend
    environment:
      BACKEND_TIMEOUT: "${BACKEND_TIMEOUT:-180}"
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    restart: unless-stopped

  frontend_react:
    build:
      context: .
      target: react
    depends_on:
      - backend
    environment:
      VITE_BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_REACT_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  backend_cache:
