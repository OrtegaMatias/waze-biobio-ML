name: waze-biobio-ml

services:
  backend:
    build:
      context: .
      target: backend
    environment:
      PYTHONPATH: /app
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped
    volumes:
      - ./data/raw:/app/data/raw:ro
      - ./data/processed:/app/data/processed:ro
      - backend_cache:/app/data/cache

  frontend:
    build:
      context: .
      target: frontend
      args:
        VITE_BACKEND_URL: "${VITE_BACKEND_URL:-http://localhost:8000}"
    depends_on:
      - backend
    ports:
      - "${FRONTEND_REACT_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  backend_cache:
