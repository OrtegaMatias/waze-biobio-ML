name: waze-biobio-ml

services:
  backend:
    build:
      context: .
      target: backend
    environment:
      PYTHONPATH: /app
      AUTO_BOOTSTRAP_ENABLED: "1"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped
    volumes:
      - ./data/raw:/app/data/raw:ro
      - ./data/processed:/app/data/processed:ro
      - ./data/air_quality:/app/data/air_quality:ro
      - ./data_processed:/app/data_processed:ro
      - ./data_analysis:/app/data_analysis:ro
      - backend_cache:/app/data/cache

  frontend:
    build:
      context: .
      target: frontend
      args:
        VITE_BACKEND_URL: "${VITE_BACKEND_URL:-}"
        VITE_ENABLE_INTERNAL_ROUTING_COSTS: "${VITE_ENABLE_INTERNAL_ROUTING_COSTS:-false}"
    environment:
      BACKEND_URL: "http://backend:8000"
    depends_on:
      - backend
    ports:
      - "${FRONTEND_REACT_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  backend_cache:
